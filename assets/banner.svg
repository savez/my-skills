<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="my-skills: insegna mestieri nuovi al tuo agente AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="0.55" stop-color="#4C1D95"/>
      <stop offset="1" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#CBD5E1"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" opacity="0.10"/>
    </pattern>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#dots)"/>

  <!-- titolo -->
  <text x="80" y="140" class="t" font-size="84" font-weight="800" fill="#FFFFFF" letter-spacing="-2">my-skills</text>
  <text x="84" y="190" class="t" font-size="28" font-weight="500" fill="#E9D5FF">Insegna un mestiere nuovo al tuo agente AI.</text>
  <text x="84" y="226" class="t" font-size="22" fill="#FED7AA" opacity="0.9">Skill · Prompt · Guide — pronte all'uso, in italiano</text>

  <!-- chip -->
  <g class="m" font-size="18" font-weight="600">
    <rect x="84" y="250" width="150" height="36" rx="18" fill="#FFFFFF" opacity="0.14"/>
    <text x="159" y="274" text-anchor="middle" fill="#FFFFFF">Claude Code</text>
    <rect x="246" y="250" width="110" height="36" rx="18" fill="#FFFFFF" opacity="0.14"/>
    <text x="301" y="274" text-anchor="middle" fill="#FFFFFF">Hermes</text>
    <rect x="368" y="250" width="110" height="36" rx="18" fill="#FFFFFF" opacity="0.14"/>
    <text x="423" y="274" text-anchor="middle" fill="#FFFFFF">Copilot</text>
    <rect x="490" y="250" width="96" height="36" rx="18" fill="#FFFFFF" opacity="0.14"/>
    <text x="538" y="274" text-anchor="middle" fill="#FFFFFF">Codex</text>
  </g>

  <!-- file SKILL.md fluttuanti -->
  <g transform="translate(780 52) rotate(-8)">
    <rect width="150" height="96" rx="12" fill="#FFFFFF" opacity="0.95"/>
    <text x="16" y="32" class="m" font-size="17" font-weight="700" fill="#4C1D95">SKILL.md</text>
    <rect x="16" y="48" width="110" height="7" rx="3.5" fill="#C4B5FD"/>
    <rect x="16" y="64" width="80" height="7" rx="3.5" fill="#FDBA74"/>
  </g>
  <g transform="translate(790 186) rotate(7)">
    <rect width="130" height="84" rx="12" fill="#FFFFFF" opacity="0.92"/>
    <text x="14" y="30" class="m" font-size="16" font-weight="700" fill="#C2410C">prompt.md</text>
    <rect x="14" y="44" width="96" height="7" rx="3.5" fill="#FDBA74"/>
    <rect x="14" y="58" width="64" height="7" rx="3.5" fill="#C4B5FD"/>
  </g>

  <!-- robottino con chiave inglese -->
  <g transform="translate(980 70)">
    <!-- antenna -->
    <line x1="80" y1="8" x2="80" y2="34" stroke="#F8FAFC" stroke-width="6" stroke-linecap="round"/>
    <circle cx="80" cy="8" r="10" fill="#FB923C"/>
    <!-- testa -->
    <rect x="10" y="34" width="140" height="110" rx="34" fill="url(#head)"/>
    <rect x="28" y="56" width="104" height="62" rx="22" fill="#1E1B4B"/>
    <!-- occhi felici -->
    <path d="M50 92 q12 -16 24 0" stroke="#5EEAD4" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M86 92 q12 -16 24 0" stroke="#5EEAD4" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- guance -->
    <circle cx="38" cy="128" r="7" fill="#FDA4AF" opacity="0.8"/>
    <circle cx="122" cy="128" r="7" fill="#FDA4AF" opacity="0.8"/>
    <!-- orecchie -->
    <rect x="0" y="74" width="14" height="34" rx="7" fill="#FB923C"/>
    <rect x="146" y="74" width="14" height="34" rx="7" fill="#FB923C"/>
    <!-- chiave inglese -->
    <g transform="translate(150 120) rotate(35)">
      <rect x="0" y="-7" width="62" height="14" rx="7" fill="#E2E8F0"/>
      <path d="M58 -20 a20 20 0 1 1 0 40 l0 -12 l10 0 l0 -16 l-10 0 z" fill="#E2E8F0"/>
    </g>
  </g>

  <!-- scintille -->
  <g fill="#FDE68A">
    <path d="M700 80 l5 12 l12 5 l-12 5 l-5 12 l-5 -12 l-12 -5 l12 -5 z"/>
    <path d="M1210 50 l3.5 8 l8 3.5 l-8 3.5 l-3.5 8 l-3.5 -8 l-8 -3.5 l8 -3.5 z"/>
    <path d="M960 270 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 z"/>
  </g>
</svg>
